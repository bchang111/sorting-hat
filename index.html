<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#100d14">
<title>The Sorting Hat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&display=swap">
<style>
  /* Layout: one candlelit screen. The hat is the stage; captions and one control sit beneath it; settings tucked below. */
  :root {
    --night: #100d14;
    --night-2: #1c1722;
    --parchment: #eadcbf;
    --dim: #9b8f79;
    --ember: #e8a64a;
    --hat-hi: #6d5439;
    --hat-lo: #2b2018;
    --hat-line: #150e09;
    --house-1: #3a2a1a;
    --house-2: #e8a64a;
    --display: "IM Fell English SC", Georgia, "Times New Roman", serif;
    --body: "IM Fell English", Georgia, "Times New Roman", serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background-color: var(--night);
    color: var(--parchment);
    font-family: var(--body);
    font-size: 18px;
    line-height: 1.45;
    -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
  }
  /* House-tinted glow sits on its own layer so it can fade between houses. */
  .glow {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      radial-gradient(ellipse 80% 55% at 50% 38%, color-mix(in srgb, var(--house-1) 70%, transparent), transparent 72%),
      radial-gradient(ellipse at 50% 120%, rgba(0,0,0,0.7), transparent 60%);
    transition: opacity 1.2s ease;
  }
  #sky { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }

  main {
    position: relative; z-index: 2;
    min-height: 100%;
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    padding-top: max(20px, env(safe-area-inset-top, 0px));
    padding-bottom: max(24px, env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    text-align: center;
  }
  h1 {
    font-family: var(--display); font-weight: 400;
    font-size: 1.15rem; letter-spacing: 0.32em; text-indent: 0.32em;
    margin: 0; color: var(--ember); opacity: 0.85;
  }
  .stage {
    flex: 1; width: 100%; max-width: 30rem;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  }

  /* ---------- the hat ---------- */
  #hat {
    background: none; border: 0; padding: 0; cursor: pointer;
    width: min(78vw, 330px); max-width: 100%;
    border-radius: 24px;
  }
  #hat:focus-visible { outline: 2px solid var(--ember); outline-offset: 6px; }
  #hat svg { display: block; width: 100%; height: auto; overflow: visible; filter: drop-shadow(0 18px 24px rgba(0,0,0,0.55)); }
  #hatg { transform-origin: 150px 250px; transition: transform 0.6s cubic-bezier(.3,.7,.3,1); }
  .eyes-open { display: none; }
  .eye-glint { fill: var(--house-2); opacity: 0.55; transition: fill 1s ease; }
  body:not([data-phase="idle"]) .eyes-open { display: inline; }
  body:not([data-phase="idle"]) .eyes-closed { display: none; }
  .eyes-open, .brows { transform-origin: 150px 148px; transition: transform 0.4s ease; }

  body[data-phase="idle"] #hatg { animation: doze 4.5s ease-in-out infinite; }
  body[data-phase="listening"] #hatg { transform: rotate(-4deg) translateY(4px); }
  body[data-phase="listening"] .brows { transform: translateY(-5px); }
  body[data-phase="pondering"] #hatg { animation: ponder 2.6s ease-in-out infinite; }
  body[data-phase="pondering"] .eyes-open { transform: scaleY(0.45); }
  body[data-phase="pondering"] .brows { transform: translateY(4px); }
  body[data-phase="reveal"] #hatg { animation: shout 0.7s cubic-bezier(.2,.8,.2,1); }
  body[data-phase="reveal"] .brows { transform: translateY(-7px); }
  @keyframes doze { 50% { transform: rotate(1.5deg) translateY(3px) scaleY(0.985); } }
  @keyframes ponder { 0%,100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
  @keyframes shout { 40% { transform: scale(1.08) translateY(-10px); } }

  /* ---------- captions ---------- */
  #says {
    min-height: 2.9em; margin: 0; max-width: 24rem;
    font-size: 1.3rem; font-style: italic; text-wrap: balance;
    text-shadow: 0 2px 12px rgba(0,0,0,0.8);
  }
  .listening {
    display: flex; align-items: center; gap: 10px;
    font-family: var(--display); letter-spacing: 0.12em; color: var(--parchment);
  }
  .bars { display: flex; gap: 4px; align-items: center; height: 22px; }
  .bars i { width: 4px; height: 100%; background: var(--ember); border-radius: 2px; animation: bar 0.9s ease-in-out infinite; }
  .bars i:nth-child(2) { animation-delay: -0.2s; } .bars i:nth-child(3) { animation-delay: -0.45s; } .bars i:nth-child(4) { animation-delay: -0.65s; }
  @keyframes bar { 0%,100% { transform: scaleY(0.25); } 50% { transform: scaleY(1); } }
  #heard { min-height: 1.5em; margin: 0; color: var(--dim); font-style: italic; max-width: 24rem; }
  #heard:not(:empty)::before { content: "\201C"; } #heard:not(:empty)::after { content: "\201D"; }

  /* ---------- the house banner ---------- */
  .banner {
    width: min(76vw, 290px);
    padding: 22px 18px 52px;
    background:
      linear-gradient(180deg, rgba(255,255,255,0.08), transparent 30%),
      var(--house-1);
    box-shadow: inset 0 0 0 3px var(--house-2), inset 0 0 0 7px var(--house-1), inset 0 0 0 8px color-mix(in srgb, var(--house-2) 60%, transparent);
    clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 84%, 0 100%);
    display: grid; gap: 6px; justify-items: center;
    transform-origin: top center;
    animation: unfurl 1s cubic-bezier(.2,.8,.2,1);
    filter: drop-shadow(0 10px 20px rgba(0,0,0,0.6));
  }
  .banner .crest {
    width: 54px; height: 54px; border-radius: 50%;
    display: grid; place-items: center;
    border: 2px solid var(--house-2); color: var(--house-2);
    font-family: var(--display); font-size: 1.9rem; line-height: 1;
  }
  #house {
    font-family: var(--display); color: var(--house-2); margin: 0;
    font-size: clamp(2.1rem, 10vw, 2.8rem); line-height: 1;
    text-shadow: 0 0 24px color-mix(in srgb, var(--house-2) 45%, transparent);
  }
  #traits { margin: 0; font-size: 0.85rem; letter-spacing: 0.08em; color: var(--parchment); opacity: 0.85; }
  @keyframes unfurl {
    from { transform: scaleY(0.05); opacity: 0; }
    60%  { opacity: 1; }
    to   { transform: none; opacity: 1; }
  }

  /* ---------- controls ---------- */
  .actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; min-height: 52px; }
  .btn {
    font: inherit; font-size: 1rem; color: var(--parchment);
    background: var(--night-2); border: 1px solid var(--dim); border-radius: 999px;
    padding: 10px 22px; cursor: pointer;
  }
  .btn.primary {
    font-family: var(--display); font-size: 1.25rem; letter-spacing: 0.06em;
    padding: 12px 30px; border-color: var(--ember);
    background: linear-gradient(180deg, color-mix(in srgb, var(--ember) 22%, var(--night-2)), var(--night-2));
    box-shadow: 0 0 28px color-mix(in srgb, var(--ember) 30%, transparent);
  }
  .btn:focus-visible { outline: 2px solid var(--ember); outline-offset: 3px; }
  .btn:active { transform: scale(0.97); }

  /* ---------- settings ---------- */
  details {
    width: 100%; max-width: 30rem; text-align: left; color: var(--dim); font-size: 0.95rem;
    border-top: 1px solid color-mix(in srgb, var(--dim) 30%, transparent); padding-top: 10px;
  }
  summary { cursor: pointer; text-align: center; letter-spacing: 0.18em; font-family: var(--display); font-size: 0.9rem; }
  .settings { display: grid; gap: 16px; padding-top: 16px; }
  .settings label { display: grid; gap: 6px; }
  .settings h3 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 0.95rem; letter-spacing: 0.1em; color: var(--parchment); }
  input[type="range"] { width: 100%; accent-color: var(--ember); }
  select {
    font: inherit; font-size: 16px; color: var(--parchment);
    background: var(--night-2); border: 1px solid var(--dim); border-radius: 8px; padding: 8px; width: 100%;
  }
  .tally { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; text-align: center; font-variant-numeric: tabular-nums; }
  .tally div { display: grid; gap: 2px; padding: 8px 2px; border-radius: 8px; background: var(--night-2); }
  .tally b { font-size: 1.4rem; color: var(--parchment); font-weight: 400; }
  .tally span { font-size: 0.7rem; letter-spacing: 0.03em; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .note { font-style: italic; margin: 0; }
  #why { margin: 0; color: var(--parchment); min-width: 0; overflow-wrap: anywhere; }
  #why small { color: var(--dim); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body data-phase="idle">
<div class="glow"></div>
<canvas id="sky"></canvas>
<main>
  <h1>The Sorting Hat</h1>

  <section class="stage" aria-live="polite">
    <button id="hat" type="button" aria-label="Begin the sorting">
      <svg viewBox="0 0 300 280" role="img" aria-hidden="true">
        <defs>
          <linearGradient id="cloth" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" style="stop-color: var(--hat-hi)"/>
            <stop offset="1" style="stop-color: var(--hat-lo)"/>
          </linearGradient>
          <linearGradient id="brim" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" style="stop-color: var(--hat-hi)"/>
            <stop offset="1" style="stop-color: var(--hat-line)"/>
          </linearGradient>
        </defs>
        <g id="hatg">
          <ellipse cx="150" cy="238" rx="134" ry="26" fill="url(#brim)"/>
          <path fill="url(#cloth)" stroke="var(--hat-line)" stroke-width="2"
                d="M60,234 C70,180 95,120 120,85 C135,60 150,35 175,30 C195,26 215,40 230,60 C214,52 198,50 186,58 C175,68 178,95 185,130 C195,175 215,205 242,234 Z"/>
          <!-- wrinkles and a stitched patch -->
          <g fill="none" stroke="var(--hat-line)" stroke-width="2.4" stroke-linecap="round" opacity="0.75">
            <path d="M100,112 Q126,122 152,108"/>
            <path d="M138,76 Q158,84 177,72"/>
            <path d="M82,214 Q104,222 124,212"/>
            <path d="M176,214 Q198,222 222,212"/>
            <path d="M195,48 Q205,56 214,52"/>
          </g>
          <path d="M150,84 l22,-4 l4,20 l-22,5 Z" fill="var(--hat-lo)" stroke="var(--hat-line)" stroke-width="1.5"/>
          <path d="M152,87 l18,-3.4 l3.2,16 l-18,4 Z" fill="none" stroke="var(--dim)" stroke-width="1" stroke-dasharray="2.5 2.5" opacity="0.6"/>
          <!-- face -->
          <g class="brows" fill="none" stroke="var(--hat-line)" stroke-width="4" stroke-linecap="round">
            <path d="M104,136 Q122,124 142,134"/>
            <path d="M156,134 Q174,124 192,136"/>
          </g>
          <g class="eyes-closed" fill="none" stroke="var(--hat-line)" stroke-width="3.5" stroke-linecap="round">
            <path d="M110,150 Q125,159 140,150"/>
            <path d="M158,150 Q172,159 187,150"/>
          </g>
          <g class="eyes-open">
            <path d="M109,152 Q124,137 141,150 Q125,160 109,152 Z" fill="var(--hat-line)"/>
            <path d="M157,150 Q172,137 188,152 Q171,160 157,150 Z" fill="var(--hat-line)"/>
            <ellipse class="eye-glint" cx="126" cy="150" rx="5" ry="3.2"/>
            <ellipse class="eye-glint" cx="172" cy="150" rx="5" ry="3.2"/>
          </g>
          <path id="mouth" fill="var(--hat-line)" stroke="var(--hat-line)" stroke-width="3" stroke-linejoin="round"
                d="M98,196 Q150,200 200,192 Q150,202 98,196 Z"/>
        </g>
      </svg>
    </button>

    <div class="banner" id="banner" hidden>
      <div class="crest" id="crest"></div>
      <p id="house"></p>
      <p id="traits"></p>
    </div>

    <p id="says">Place the hat on a student's head, then tap.</p>
    <div class="listening" id="listening" hidden><span class="bars"><i></i><i></i><i></i><i></i></span>Listening</div>
    <p id="heard"></p>

    <div class="actions">
      <button id="go" class="btn primary" type="button">Begin the Sorting</button>
      <button id="done" class="btn" type="button" hidden>They've answered</button>
    </div>
  </section>

  <details>
    <summary>Hat settings</summary>
    <div class="settings">
      <label for="depth">Voice depth
        <input id="depth" type="range" min="0.7" max="1" step="0.02" value="0.84">
      </label>
      <label for="echo">Great Hall echo
        <input id="echo" type="range" min="0" max="0.9" step="0.05" value="0.35">
      </label>
      <div class="row">
        <button id="test" class="btn" type="button">Test voice</button>
        <button id="testmic" class="btn" type="button">Test microphone</button>
      </div>
      <p class="note" id="support"></p>

      <label for="force">Next student's house
        <select id="force">
          <option value="">Let the hat decide from the answer</option>
          <option value="gryffindor">Gryffindor</option>
          <option value="hufflepuff">Hufflepuff</option>
          <option value="ravenclaw">Ravenclaw</option>
          <option value="slytherin">Slytherin</option>
        </select>
      </label>
      <p class="note">A chosen house applies to the next sorting only, then resets.</p>

      <div class="row" style="display:grid;gap:6px">
        <h3>Last sorting</h3>
        <p id="why"><small>Nobody sorted yet.</small></p>
      </div>

      <div style="display:grid;gap:8px">
        <h3>Sorted so far</h3>
        <div class="tally" id="tally"></div>
      </div>
      <div class="row">
        <button id="reset" class="btn" type="button">Reset count</button>
        <button id="reshuffle" class="btn" type="button">Reshuffle questions</button>
      </div>
    </div>
  </details>
</main>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const ORDER = ["gryffindor", "hufflepuff", "ravenclaw", "slytherin"];
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };

  let L = null;          // lines.json
  const TEXT = {};       // audio id -> caption
  const strip = (t) => t.replace(/\[\[[^\]]*\]\]/g, " ").replace(/\s+/g, " ").replace(/\s+([.,!?])/g, "$1").trim();

  // Must match audio_ids() in build_audio.py.
  function audioIds(d) {
    d.questions.forEach((t, i) => TEXT["q" + String(i + 1).padStart(2, "0")] = t);
    d.ponder.forEach((t, i) => TEXT["ponder" + (i + 1)] = t);
    d.leadIns.forEach((t, i) => TEXT["lead" + (i + 1)] = t);
    TEXT.test = d.test;
    for (const [key, h] of Object.entries(d.houses)) {
      TEXT["house-" + key] = h.name + "!";
      h.lines.forEach((t, i) => TEXT[key + (i + 1)] = t);
      h.keys.forEach((k) => TEXT["clue-" + k.replace(/ /g, "-")] = `Ah. ${k[0].toUpperCase() + k.slice(1)}. I see.`);
    }
    for (const k in TEXT) TEXT[k] = strip(TEXT[k]);
  }

  // ---------- audio engine ----------
  const AC = window.AudioContext || window.webkitAudioContext;
  const ctx = AC ? new AC() : null;
  let fx = null;
  const settings = { depth: store.get("hat-depth", 0.84), echo: store.get("hat-echo", 0.35) };
  $("depth").value = settings.depth; $("echo").value = settings.echo;

  function impulse(seconds, decay) {
    const len = Math.floor(ctx.sampleRate * seconds);
    const buf = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const data = buf.getChannelData(ch);
      for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
    }
    return buf;
  }
  function buildFx() {
    const warm = ctx.createBiquadFilter(); warm.type = "lowshelf"; warm.frequency.value = 220; warm.gain.value = 6;
    const soft = ctx.createBiquadFilter(); soft.type = "lowpass"; soft.frequency.value = 5200;
    const dry = ctx.createGain(), wet = ctx.createGain(), hall = ctx.createConvolver(), out = ctx.createGain();
    hall.buffer = impulse(2.6, 3);
    warm.connect(soft); soft.connect(dry); soft.connect(hall); hall.connect(wet);
    dry.connect(out); wet.connect(out);
    const analyser = ctx.createAnalyser(); analyser.fftSize = 512;
    out.connect(analyser); out.connect(ctx.destination);
    wet.gain.value = settings.echo; out.gain.value = 1.1;
    return { input: warm, wet, analyser };
  }
  if (ctx) fx = buildFx();

  const cache = new Map();
  function load(id) {
    if (!ctx) return Promise.resolve(null);
    if (!cache.has(id)) {
      cache.set(id, fetch(`audio/${id}.m4a`)
        .then((r) => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
        .then((b) => new Promise((res, rej) => ctx.decodeAudioData(b, res, rej)))
        .catch(() => { cache.delete(id); return null; }));
    }
    return cache.get(id);
  }
  async function wake() {
    if (ctx && ctx.state !== "running") { try { await Promise.race([ctx.resume(), wait(500)]); } catch (e) {} }
  }

  let talking = false; // drives the mouth when the fallback voice is used
  async function say(id, caption) {
    const text = caption ?? TEXT[id] ?? "";
    $("says").textContent = text;
    const buf = await load(id);
    if (!buf) return speakFallback(text);
    await wake();
    return new Promise((resolve) => {
      const src = ctx.createBufferSource();
      src.buffer = buf;
      src.playbackRate.value = settings.depth;
      src.connect(fx.input);
      let done = false;
      const finish = () => { if (done) return; done = true; resolve(); };
      src.onended = finish;
      setTimeout(finish, (buf.duration / settings.depth) * 1000 + 800);
      src.start();
    });
  }

  // Built-in speech, only if an audio file can't be loaded.
  function speakFallback(text) {
    return new Promise((resolve) => {
      if (!("speechSynthesis" in window) || !text) { setTimeout(resolve, 600 + text.length * 60); return; }
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      const v = speechSynthesis.getVoices().find((x) => x.name.startsWith("Daniel")) || speechSynthesis.getVoices().find((x) => x.lang === "en-GB");
      if (v) u.voice = v;
      u.lang = v ? v.lang : "en-GB"; u.rate = 0.85; u.pitch = 0.55;
      let done = false;
      const finish = () => { if (done) return; done = true; talking = false; clearTimeout(t); resolve(); };
      const t = setTimeout(finish, 2500 + text.length * 110);
      u.onend = finish; u.onerror = finish;
      talking = true;
      speechSynthesis.speak(u);
    });
  }

  function fanfare() {
    if (!ctx) return;
    const now = ctx.currentTime;
    [[0, 392], [0.16, 523.25], [0.32, 659.25], [0.5, 783.99], [0.5, 523.25], [0.5, 659.25], [0.5, 392]].forEach(([t, f]) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = "triangle"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, now + t);
      g.gain.exponentialRampToValueAtTime(0.22, now + t + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, now + t + (t >= 0.5 ? 1.6 : 0.3));
      o.connect(g).connect(ctx.destination);
      o.start(now + t); o.stop(now + t + 1.7);
    });
  }

  // ---------- listening ----------
  let lastAnswer = "";
  function listen(maxMs = 10000) {
    $("heard").textContent = "";
    return new Promise((resolve) => {
      let text = "", finished = false, rec = null, silence = null;
      const hardStop = setTimeout(finish, maxMs);
      function finish() {
        if (finished) return;
        finished = true;
        clearTimeout(hardStop); clearTimeout(silence);
        $("done").hidden = true; $("done").onclick = null;
        try { rec && rec.abort(); } catch (e) {}
        resolve(text.trim());
      }
      $("done").hidden = false;
      $("done").onclick = finish;
      if (!SR) return; // no recognition: wait for the tap or the timer
      rec = new SR();
      rec.lang = "en-US";
      rec.interimResults = true;
      rec.continuous = true;
      rec.onresult = (e) => {
        text = Array.from(e.results).map((r) => r[0].transcript).join(" ");
        $("heard").textContent = text;
        clearTimeout(silence);
        silence = setTimeout(finish, 1800); // they've stopped talking
      };
      rec.onerror = () => {};
      rec.onend = () => { if (text) finish(); };
      try { rec.start(); } catch (e) {}
    });
  }

  // ---------- deciding from the answer ----------
  const NEGATORS = new Set(["not", "don't", "dont", "never", "no", "isn't", "wouldn't", "won't", "can't"]);
  const stem = (w) => (w.length >= 4 ? w.replace(/(ings?|ers?|ed|es|s)$/, "").replace(/e$/, "") : w);
  let KEYSTEMS = null;
  function keyIndex() {
    KEYSTEMS = new Map();
    for (const h of ORDER) for (const k of L.houses[h].keys) KEYSTEMS.set(stem(k), { house: h, key: k });
  }

  // Clue words the hat itself said in the question don't count, unless they were one of the
  // offered choices (the "a, b, c, or d" part). Otherwise "the dragon egg" would always mean Gryffindor.
  function echoStems(qid) {
    const q = strip(TEXT[qid] || "").toLowerCase();
    const choices = q.split(/[.?!]/).filter((s) => s.includes(" or ")).join(" ");
    const ignore = new Set();
    for (const w of q.match(/[a-z']+/g) || []) {
      if (KEYSTEMS.has(stem(w)) && !new RegExp("\\b" + w + "\\b").test(choices)) ignore.add(stem(w));
    }
    return ignore;
  }

  function decide(answer, qid) {
    const ignore = qid ? echoStems(qid) : new Set();
    const scores = { gryffindor: 0, hufflepuff: 0, ravenclaw: 0, slytherin: 0 };
    const reasons = { gryffindor: [], hufflepuff: [], ravenclaw: [], slytherin: [] };
    const clues = { gryffindor: null, hufflepuff: null, ravenclaw: null, slytherin: null };
    let text = " " + answer.toLowerCase().replace(/[^a-z' ]+/g, " ").replace(/\s+/g, " ") + " ";
    text = text.replace(/ (kind|sort) of /g, " ");

    // Phrases first (worth 2), longest first, removing each so shorter ones don't double count.
    const phrases = ORDER.flatMap((h) => (L.houses[h].phrases || []).map((p) => ({ h, p })))
      .sort((a, b) => b.p.length - a.p.length);
    for (const { h, p } of phrases) {
      const needle = " " + p + " ";
      const at = text.indexOf(needle);
      if (at === -1) continue;
      const before = text.slice(0, at).trim().split(" ").slice(-2);
      if (!/^(not|don't|dont|never|no) /.test(p) && before.some((w) => NEGATORS.has(w))) continue;
      scores[h] += 2; reasons[h].push(`"${p}"`);
      text = text.slice(0, at) + " | " + text.slice(at + needle.length - 1);
    }

    // Single words (worth 1), skipping ones just after "not", "never" and so on.
    const words = text.split(" ").filter(Boolean);
    words.forEach((w, i) => {
      if (w === "|" || ignore.has(stem(w))) return;
      const hit = KEYSTEMS.get(stem(w)) || KEYSTEMS.get(w);
      if (!hit) return;
      if (NEGATORS.has(words[i - 1]) || NEGATORS.has(words[i - 2])) return;
      scores[hit.house] += 1; reasons[hit.house].push(hit.key);
      clues[hit.house] = clues[hit.house] || hit.key;
    });

    // How they answered (worth half a point): only matters when the words alone don't settle it.
    const all = answer.toLowerCase().match(/[a-z']+/g) || [];
    if (all.length) {
      const count = (list) => all.filter((w) => list.includes(w)).length;
      if (all.length <= 3) { scores.gryffindor += 0.5; reasons.gryffindor.push("a quick, bold answer"); }
      if (all.length >= 12) { scores.ravenclaw += 0.5; reasons.ravenclaw.push("a thoughtful, long answer"); }
      if (count(["why", "how", "maybe", "probably", "because", "think", "wonder"]) >= 1) { scores.ravenclaw += 0.5; reasons.ravenclaw.push("thinking it through"); }
      if (count(["we", "us", "our", "everybody", "everyone", "friends", "together"]) >= 1) { scores.hufflepuff += 0.5; reasons.hufflepuff.push("thinking of others"); }
      if (count(["i", "me", "my", "mine", "myself", "i'd", "i'll", "i'm"]) >= 3) { scores.slytherin += 0.5; reasons.slytherin.push("thinking of themselves"); }
    }

    const best = Math.max(...ORDER.map((h) => scores[h]));
    let pool, how;
    if (best > 0) {
      pool = ORDER.filter((h) => scores[h] === best);
      how = pool.length > 1 ? "a tie, so the house with fewer students won" : "the answer";
    } else {
      pool = ORDER.slice();
      how = answer ? "no clues in the answer, so the house with fewer students won" : "nothing was heard, so the house with fewer students won";
    }
    // Ties go to the house with the fewest students so far.
    const fewest = Math.min(...pool.map((h) => tally[h] || 0));
    const house = pick(pool.filter((h) => (tally[h] || 0) === fewest));
    return { house, clue: clues[house], scores, reasons: reasons[house], how };
  }

  // ---------- question deck: every question once before any repeats ----------
  function nextQuestion() {
    const n = L.questions.length;
    let deck = store.get("hat-deck", []).filter((i) => Number.isInteger(i) && i < n);
    if (!deck.length) {
      deck = [...Array(n).keys()];
      for (let i = n - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [deck[i], deck[j]] = [deck[j], deck[i]]; }
      const last = store.get("hat-last-q", -1);
      if (deck[0] === last && n > 1) [deck[0], deck[1]] = [deck[1], deck[0]];
    }
    const q = deck.shift();
    store.set("hat-deck", deck); store.set("hat-last-q", q);
    return "q" + String(q + 1).padStart(2, "0");
  }

  // ---------- tally ----------
  let tally = Object.assign({ gryffindor: 0, hufflepuff: 0, ravenclaw: 0, slytherin: 0 }, store.get("hat-tally", {}));
  function renderTally() {
    $("tally").innerHTML = ORDER.map((h) => `<div><b>${tally[h] || 0}</b><span>${h[0].toUpperCase() + h.slice(1)}</span></div>`).join("");
  }
  renderTally();

  // ---------- sky: drifting embers, and sparks on a reveal ----------
  const sky = $("sky"), g2 = sky.getContext("2d");
  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    sky.width = W * DPR; sky.height = H * DPR;
    g2.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  resize(); addEventListener("resize", resize);
  let emberColor = [232, 166, 74];
  const embers = Array.from({ length: reduceMotion ? 0 : 38 }, () => newEmber(true));
  function newEmber(anywhere) {
    return { x: Math.random() * W, y: anywhere ? Math.random() * H : H + 10, r: 0.8 + Math.random() * 2.2,
             vy: 0.15 + Math.random() * 0.45, sway: Math.random() * Math.PI * 2, a: 0.25 + Math.random() * 0.55 };
  }
  let sparks = [];
  function burst(cx, cy, colors) {
    if (reduceMotion) return;
    for (let i = 0; i < 140; i++) {
      const ang = Math.random() * Math.PI * 2, sp = 2 + Math.random() * 7;
      sparks.push({ x: cx, y: cy, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 3, life: 1, r: 1.5 + Math.random() * 2.5, c: pick(colors) });
    }
  }

  const mouth = $("mouth");
  let mouthOpen = 0;
  const td = new Uint8Array(256);
  function frame(t) {
    // Mouth follows the hat's voice.
    let level = 0;
    if (fx) {
      fx.analyser.getByteTimeDomainData(td);
      let sum = 0;
      for (let i = 0; i < td.length; i++) { const v = (td[i] - 128) / 128; sum += v * v; }
      level = Math.min(1, Math.sqrt(sum / td.length) * 5);
    }
    if (talking) level = Math.max(level, 0.25 + 0.35 * Math.abs(Math.sin(t / 90)) * Math.random());
    mouthOpen += (level - mouthOpen) * 0.35;
    const o = mouthOpen;
    mouth.setAttribute("d", `M98,196 Q150,${200 - o * 8} 200,192 Q150,${202 + o * 46} 98,196 Z`);

    g2.clearRect(0, 0, W, H);
    const [r, g, b] = emberColor;
    for (const e of embers) {
      e.y -= e.vy; e.sway += 0.01; e.x += Math.sin(e.sway) * 0.25;
      if (e.y < -10) Object.assign(e, newEmber(false));
      const flicker = e.a * (0.75 + 0.25 * Math.sin(t / 200 + e.sway * 10));
      g2.beginPath(); g2.fillStyle = `rgba(${r},${g},${b},${flicker})`;
      g2.shadowColor = `rgba(${r},${g},${b},0.9)`; g2.shadowBlur = 8;
      g2.arc(e.x, e.y, e.r, 0, Math.PI * 2); g2.fill();
    }
    g2.shadowBlur = 0;
    sparks = sparks.filter((s) => s.life > 0);
    for (const s of sparks) {
      s.x += s.vx; s.y += s.vy; s.vy += 0.12; s.vx *= 0.985; s.life -= 0.011;
      g2.globalAlpha = Math.max(0, s.life);
      g2.fillStyle = s.c;
      g2.beginPath(); g2.arc(s.x, s.y, s.r, 0, Math.PI * 2); g2.fill();
    }
    g2.globalAlpha = 1;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ---------- the ceremony ----------
  const setPhase = (p) => { document.body.dataset.phase = p; };
  function setHouse(h) {
    const root = document.documentElement.style;
    if (!h) {
      root.removeProperty("--house-1"); root.removeProperty("--house-2");
      emberColor = [232, 166, 74];
      return;
    }
    root.setProperty("--house-1", L.houses[h].c1);
    root.setProperty("--house-2", L.houses[h].c2);
    const hex = L.houses[h].c2.replace("#", "");
    emberColor = [0, 2, 4].map((i) => parseInt(hex.slice(i, i + 2), 16));
  }

  let running = false;
  async function sort() {
    if (running || !L) return;
    running = true;
    $("go").hidden = true;
    $("banner").hidden = true;
    $("heard").textContent = "";
    setHouse(null);
    try { navigator.wakeLock?.request("screen").catch(() => {}); } catch (e) {}

    setPhase("speaking");
    const qid = nextQuestion();
    await say(qid);

    setPhase("listening");
    $("says").textContent = "";
    $("listening").hidden = false;
    const answer = await listen();
    $("listening").hidden = true;
    lastAnswer = answer;

    setPhase("pondering");
    const forced = $("force").value;
    const result = decide(answer, qid);
    if (forced) { result.house = forced; result.clue = null; result.how = "chosen in settings"; }
    $("force").value = "";

    // Start loading what's needed while the hat ponders.
    const h = result.house;
    const lineId = h + (1 + Math.floor(Math.random() * L.houses[h].lines.length));
    const leadId = "lead" + (1 + Math.floor(Math.random() * L.leadIns.length));
    const clueId = result.clue ? "clue-" + result.clue.replace(/ /g, "-") : null;
    [clueId, lineId, leadId, "house-" + h].forEach((id) => id && load(id));

    if (clueId) await say(clueId);
    await say("ponder" + (1 + Math.floor(Math.random() * L.ponder.length)));
    await say(lineId);
    await wait(250);
    await say(leadId);
    await wait(400);

    setPhase("reveal");
    setHouse(h);
    $("crest").textContent = L.houses[h].name[0];
    $("house").textContent = L.houses[h].name;
    $("traits").textContent = L.houses[h].traits || "";
    $("banner").hidden = false;
    const box = $("hat").getBoundingClientRect();
    burst(box.left + box.width / 2, box.top + box.height * 0.45, [L.houses[h].c2, L.houses[h].c1, "#fff6dc"]);
    fanfare();
    await say("house-" + h, ""); // the banner already shows the name

    tally[h] = (tally[h] || 0) + 1;
    store.set("hat-tally", tally); renderTally();
    const scoreList = ORDER.filter((x) => result.scores[x] > 0).map((x) => `${L.houses[x].name} ${result.scores[x]}`).join(", ");
    $("why").innerHTML = "";
    $("why").append(
      Object.assign(document.createElement("span"), { textContent: `Heard: ${answer ? `“${answer}”` : "nothing"}` }),
      document.createElement("br"),
      Object.assign(document.createElement("span"), { textContent: `${L.houses[h].name}, decided by ${result.how}${result.reasons.length && !forced ? ` (${result.reasons.join(", ")})` : ""}.` }),
      document.createElement("br"),
      Object.assign(document.createElement("small"), { textContent: scoreList ? `Scores: ${scoreList}` : "No clue words found." })
    );

    $("go").textContent = "Sort the next student";
    $("go").hidden = false;
    running = false;
  }

  function unlockAndSort() {
    // iOS only lets sound start inside the tap itself, so wake the audio before anything else.
    if (ctx) {
      ctx.resume();
      const s = ctx.createBufferSource(); s.buffer = ctx.createBuffer(1, 1, 22050); s.connect(ctx.destination); s.start();
    }
    sort();
  }
  $("go").addEventListener("click", unlockAndSort);
  $("hat").addEventListener("click", unlockAndSort);

  // ---------- settings ----------
  $("depth").addEventListener("input", (e) => { settings.depth = +e.target.value; store.set("hat-depth", settings.depth); });
  $("echo").addEventListener("input", (e) => {
    settings.echo = +e.target.value; store.set("hat-echo", settings.echo);
    if (fx) fx.wet.gain.value = settings.echo;
  });
  $("test").addEventListener("click", () => {
    if (running) return;
    if (ctx) ctx.resume();
    setPhase("speaking");
    say("test").then(() => { if (!running) { setPhase("idle"); $("says").textContent = "Place the hat on a student's head, then tap."; } });
  });
  $("testmic").addEventListener("click", async () => {
    if (running) return;
    if (!SR) { $("support").textContent = "This browser can't turn speech into words, so the hat can't hear answers. Try Safari."; return; }
    $("support").textContent = "Say something now.";
    const t = await listen(6000);
    $("support").textContent = t ? `Microphone works. Heard: “${t}”` : "Heard nothing. Check that Safari has microphone access and that Siri & Dictation are turned on.";
  });
  $("reset").addEventListener("click", () => {
    tally = { gryffindor: 0, hufflepuff: 0, ravenclaw: 0, slytherin: 0 };
    store.set("hat-tally", tally); renderTally();
  });
  $("reshuffle").addEventListener("click", () => { store.set("hat-deck", []); $("reshuffle").textContent = "Questions reshuffled"; });

  if (!SR) $("support").textContent = "Speech recognition isn't available in this browser, so the hat can't hear answers. Use Safari on iPhone.";

  // ---------- start ----------
  fetch("lines.json").then((r) => r.json()).then((d) => {
    L = d;
    audioIds(d);
    keyIndex();
    // Preload everything except the per-word clue lines, which load as needed.
    Object.keys(TEXT).filter((id) => !id.startsWith("clue-")).forEach(load);
  }).catch(() => {
    $("says").textContent = "The hat's lines didn't load. Check the connection and reload the page.";
  });

  // For quick checks from the console.
  window.__hat = { decide: (a, qid) => decide(a, qid) };
})();
</script>
</body>
</html>
